        <!-- PAGE: CONTACT -->
        <section id="contact" class="page-section hidden fade-in">
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-12">
                <!-- Info Contact -->
                <div>
                    <h2 class="text-3xl font-bold mb-6 text-brand-blue dark:text-blue-400">Contactez-nous</h2>
                    <p class="mb-8 text-gray-600 dark:text-gray-300">
                        Vous avez un projet en tête ? Vous souhaitez nous rejoindre ? Remplissez le formulaire ci-contre et nous vous répondrons dans les plus brefs délais.
                    </p>
                    
                    <div class="space-y-4">
                        <div class="flex items-center">
                            <div class="w-10 h-10 rounded-full bg-blue-100 dark:bg-blue-900 flex items-center justify-center text-brand-blue mr-4">
                                <i class="fas fa-envelope"></i>
                            </div>
                            <span>contact@uniproclub.com</span>
                        </div>
                        <div class="flex items-center">
                            <div class="w-10 h-10 rounded-full bg-blue-100 dark:bg-blue-900 flex items-center justify-center text-brand-blue mr-4">
                                <i class="fas fa-phone"></i>
                            </div>
                            <span>+33 1 23 45 67 89</span>
                        </div>
                        <div class="flex items-center">
                            <div class="w-10 h-10 rounded-full bg-blue-100 dark:bg-blue-900 flex items-center justify-center text-brand-blue mr-4">
                                <i class="fas fa-map-marker-alt"></i>
                            </div>
                            <span>Campus Universitaire, Batiment C</span>
                        </div>
                    </div>
                </div>

                <!-- Formulaires -->
                <div class="bg-white dark:bg-gray-800 p-8 rounded-2xl shadow-lg">
                    <!-- Tabs -->
                    <div class="flex border-b border-gray-200 dark:border-gray-700 mb-6">
                        <button onclick="switchContactTab('message')" id="tab-message" class="pb-2 px-4 border-b-2 border-brand-blue font-medium text-brand-blue dark:text-blue-400">Message</button>
                        <button onclick="switchContactTab('quote')" id="tab-quote" class="pb-2 px-4 border-b-2 border-transparent font-medium text-gray-500 hover:text-gray-700 dark:hover:text-gray-300">Demande de Devis</button>
                    </div>

                    <!-- Formulaire Message -->
                    <form id="contact-form" onsubmit="handleContactSubmit(event)">
                        <div class="mb-4">
                            <label class="block text-sm font-medium mb-1">Nom complet</label>
                            <input type="text" required class="w-full p-2 rounded border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 focus:ring-2 focus:ring-brand-blue outline-none">
                        </div>
                        <div class="mb-4">
                            <label class="block text-sm font-medium mb-1">Email</label>
                            <input type="email" required class="w-full p-2 rounded border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 focus:ring-2 focus:ring-brand-blue outline-none">
                        </div>
                        <div class="mb-4">
                            <label class="block text-sm font-medium mb-1">Message</label>
                            <textarea rows="4" required class="w-full p-2 rounded border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 focus:ring-2 focus:ring-brand-blue outline-none"></textarea>
                        </div>
                        <button type="submit" class="w-full bg-brand-blue text-white py-2 rounded font-bold hover:bg-blue-800 transition">Envoyer</button>
                    </form>

                    <!-- Formulaire Devis (Caché par défaut) -->
                    <form id="quote-form" class="hidden" onsubmit="handleContactSubmit(event)">
                        <div class="mb-4">
                            <label class="block text-sm font-medium mb-1">Entreprise / Nom</label>
                            <input type="text" required class="w-full p-2 rounded border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 focus:ring-2 focus:ring-brand-blue outline-none">
                        </div>
                        <div class="mb-4">
                            <label class="block text-sm font-medium mb-1">Type de service</label>
                            <select class="w-full p-2 rounded border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 focus:ring-2 focus:ring-brand-blue outline-none">
                                <option>Création Site Web</option>
                                <option>Développement Application</option>
                                <option>Conseil Informatique</option>
                                <option>Autre</option>
                            </select>
                        </div>
                        <div class="mb-4">
                            <label class="block text-sm font-medium mb-1">Détails du projet</label>
                            <textarea rows="4" required class="w-full p-2 rounded border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 focus:ring-2 focus:ring-brand-blue outline-none"></textarea>
                        </div>
                        <button type="submit" class="w-full bg-brand-red text-white py-2 rounded font-bold hover:bg-red-700 transition">Demander un devis</button>
                    </form>
                </div>
            </div>
        </section>
